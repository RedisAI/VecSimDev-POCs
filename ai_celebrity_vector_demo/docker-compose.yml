version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-celebrity-search
    ports:
      - "6379:6379"  # Redis port
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
    driver: local

